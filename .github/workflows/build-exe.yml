name: Build Windows app

# Runs when you publish a GitHub Release (and attaches passgen.exe to it),
# or manually from the Actions tab (the exe is then a downloadable artifact).
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Build passgen.exe
        run: pyinstaller --onefile --windowed --name passgen --paths . packaging/run_gui.py

      - name: Create checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/passgen.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  passgen.exe" | Out-File -Encoding ascii dist/passgen.exe.sha256

      - name: Keep as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: passgen-windows
          path: |
            dist/passgen.exe
            dist/passgen.exe.sha256

      - name: Attach to the release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/passgen.exe dist/passgen.exe.sha256 --clobber
