[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "passgen"
dynamic = ["version"]
description = "A simple, secure, local command-line password generator."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "tenaviel" }]
keywords = ["password", "generator", "security", "cli", "secrets"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Security",
]
dependencies = []

[project.scripts]
passgen = "passgen.cli:main"

[project.urls]
Homepage = "https://github.com/tenaviel/passgen"
Issues = "https://github.com/tenaviel/passgen/issues"

[tool.setuptools]
packages = ["passgen"]

[tool.setuptools.dynamic]
version = { attr = "passgen.__version__" }
